quirks:
  - "Android 11 denies shell access to app-private Android/data storage. Import the DNS list from Android/media through the app, grant its storage permissions, disable default feeds, and use the normal in-app restart before rebooting. The log confirmed 410 entries and 397 unique entries."
  - "The package com.amazon.firebat is Prime Video on this build and must remain enabled."
  - "The first pass disabled 57 packages; after reboot 52 remained disabled. The returning packages were com.amazon.dummy.contacts, com.amazon.dummy.gallery, com.amazon.dummy.music, com.amazon.dummy.settings, and com.android.traceur."
  - "The unmodified dumbtv home 1.1 worked, including the owner pressing physical HOME from Stremio. The owner later selected Projectivy instead; dumbtv home was uninstalled."
  - "Projectivy 4.72 from its developer GitHub release installed successfully and opened automatically after reboot without input. Its accessibility service remained bound, and injected HOME returned from Stremio to Projectivy. The owner confirmed physical HOME from Stremio returns to Projectivy Favorites. Amazon Settings remained accessible."
  - "Projectivy hides Favorites by default. Add the streaming apps, enable Visible and Grid for Favorites, then hide the other home categories. The top settings menu still provides access to all apps."
  - "The generic Android Settings shortcut resolves to com.amazon.tv.launcher/.ui.SettingsActivity, a stub. Open the real Settings screen with MAIN and android.intent.category.LEANBACK_SETTINGS, which resolves to com.amazon.tv.launcher/.ui.MainSettingsActivity. It stays open with Projectivy enabled."
  - "Projectivy's Configuración Amazon entry opens com.amazon.whasettings/.MainActivity. A local zero-permission shortcut app, tv.dumbtv.settings (Ajustes de Fire TV), was installed and pinned to Favorites to launch the real Settings screen through MAIN and LEANBACK_SETTINGS. Selecting the tile kept MainSettingsActivity open for five seconds; HOME returned to Projectivy. The nine streaming tiles were preserved."
  - "Restarting the host adb server fixed a stale connection error even though ping and the TCP port were reachable. The owner then accepted authorization."
notes: "Fire OS 8.1.8.5: debloat and DNS hostname checks passed after reboot. Projectivy starts automatically with nine streaming apps in its Favorites grid, and the owner confirmed physical HOME from Stremio returns to that grid."
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
